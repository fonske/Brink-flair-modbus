## M5Stack ENV III as a convenience bundle: it just wires together the two chips of the ENV III,
##   - SHT30/SHT3xD (temperature + humidity @0x44)  -> sensor-sht30.yaml
##   - QMP6988      (atmospheric pressure   @0x70)  -> sensor-qmp6988.yaml
## so a user with an ENV III module only has to include THIS one file per channel.
##
## The two chips also exist as standalone packages, so you can activate them individually from your
## local config: use sensor-sht30.yaml alone for temp/humidity only (no pressure), or add
## sensor-qmp6988.yaml for pressure only. This file = both together.
##
## Works WITH and WITHOUT the PaHUB multiplexer (see sensor-sht30.yaml for details).
## NOTE: behind the PaHUB, keep the PaHUB address != 0x70 (the QMP6988 sits at 0x70). See m5stack-pahub-tca9548a.yaml.
##
## vars:
##   channel      - the I2C bus id the sensor is on (physical bus like bus_a, or a PaHUB channel)
##   id_prefix    - short, language-independent ASCII key for the entity ids (brink_ext_<id_prefix>_...)
##   sensor_name  - display name, may come from the label files (e.g. ${brink_air_extract})
defaults:
  channel: bus_a

packages:
  sht30: !include
    file: sensor-sht30.yaml
    vars:
      channel: ${channel}
      id_prefix: ${id_prefix}
      sensor_name: ${sensor_name}
  qmp6988: !include
    file: sensor-qmp6988.yaml
    vars:
      channel: ${channel}
      id_prefix: ${id_prefix}
      sensor_name: ${sensor_name}

## Dew point calculated from the SHT30 temperature + humidity of this channel.
sensor:
  - platform: template
    name: "${sensor_name} ${label_dewpoint}"
    id: brink_ext_${id_prefix}_dewpoint
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-water"
    update_interval: 30s
    lambda: |-
      return (243.5*(log(id(brink_ext_${id_prefix}_humidity).state/100)+((17.67*id(brink_ext_${id_prefix}_temperature).state)/
      (243.5+id(brink_ext_${id_prefix}_temperature).state)))/(17.67-log(id(brink_ext_${id_prefix}_humidity).state/100)-
      ((17.67*id(brink_ext_${id_prefix}_temperature).state)/(243.5+id(brink_ext_${id_prefix}_temperature).state))));
